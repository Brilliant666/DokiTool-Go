name: Gateway isolation

on:
  pull_request:
    branches: [main]
    paths:
      - backend/internal/ytengine/**
      - backend/cmd/dokitool/**
      - scripts/test-gateway-nft.py
      - .github/workflows/gateway-isolation.yml

permissions:
  contents: read

concurrency:
  group: gateway-isolation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  controlled-gateway:
    if: github.repository == 'Brilliant666/DokiTool-Go'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Install network fixture tools on the disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nftables iproute2 util-linux
      - name: Stage the pinned extractor for controlled proxy handshakes
        run: |
          mkdir -p "$RUNNER_TEMP/gateway-bin"
          curl --fail --silent --show-error --location \
            https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_linux \
            --output "$RUNNER_TEMP/gateway-bin/yt-dlp_linux"
          echo '767ba9dce7052aa196f8b12652f433d76de128ba168966fa84b6394d5e6c6795  '"$RUNNER_TEMP/gateway-bin/yt-dlp_linux" | sha256sum --check --strict
          chmod 0555 "$RUNNER_TEMP/gateway-bin/yt-dlp_linux"
          "$RUNNER_TEMP/gateway-bin/yt-dlp_linux" --version
      - name: Verify real gateways and pinned extractor as nonroot
        working-directory: backend
        env:
          YTDLP_TEST_BINARY: ${{ runner.temp }}/gateway-bin/yt-dlp_linux
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          go test -race -count=1 -v ./internal/ytengine | tee "$RUNNER_TEMP/gateway-engine.txt"
      - name: Verify exact network-rule delta in disconnected namespaces
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if sudo setpriv --reuid 23147 --regid 23147 --clear-groups test -r "$GITHUB_WORKSPACE/scripts/test-gateway-nft.py"; then
            echo 'fixture UID can read the checkout path'
          else
            echo 'fixture UID cannot read the checkout path; no checkout permissions will be changed'
          fi
          fixture_dir=$(mktemp -d /tmp/dokitool-gateway-fixture.XXXXXXXX)
          chmod 0755 "$fixture_dir"
          install -m 0644 scripts/test-gateway-nft.py "$fixture_dir/test-gateway-nft.py"
          trap 'rm -f "$fixture_dir/test-gateway-nft.py"; rmdir "$fixture_dir"' EXIT
          sudo python3 -B "$fixture_dir/test-gateway-nft.py" --output "$RUNNER_TEMP/gateway-nft.json"
      - name: Retain controlled evidence, without proxy credentials
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gateway-isolation-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/gateway-engine.txt
            ${{ runner.temp }}/gateway-nft.json
          if-no-files-found: warn
          retention-days: 7
